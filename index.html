
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xprime.store | Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 padding:20px;
}
.container{
 width:100%;
 max-width:420px;
 background:#1d293b;
 padding:28px;
 border-radius:18px;
 box-shadow:0 10px 35px #0005;
}
h1{text-align:center;color:#39dba0}
p{text-align:center;color:#aab6c7}
input{
 width:100%;
 padding:14px;
 margin:9px 0;
 border:1px solid #46536a;
 border-radius:9px;
 background:#101827;
 color:white;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:9px;
 background:#20bd87;
 color:#061b14;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
}
.secondary{background:#34445c;color:white}
#dashboard{display:none}
#message{
 text-align:center;
 margin-top:15px;
 color:#39dba0;
 overflow-wrap:anywhere;
}
</style>
</head>

<body>

<div class="container">

<h1>Xprime.store</h1>
<p>Secure Account Portal</p>

<div id="auth">

<h2>Sign Up</h2>

<form id="signupForm">
<input id="signupEmail" type="email"
placeholder="Email address" required>

<input id="signupPassword" type="password"
placeholder="Create password (minimum 6 characters)"
minlength="6" required>

<button type="submit">Create Account</button>
</form>

<hr>

<h2>Login</h2>

<form id="loginForm">
<input id="loginEmail" type="email"
placeholder="Email address" required>

<input id="loginPassword" type="password"
placeholder="Password" required>

<button type="submit">Login</button>
</form>

</div>

<div id="dashboard">
<h2>Welcome!</h2>
<p>You are successfully logged in.</p>
<p id="userEmail"></p>
<button onclick="logout()">Logout</button>
</div>

<div id="message"></div>

</div>

<script>
// SUPABASE CONFIGURATION

const SUPABASE_URL =
"https://yygzkoxfksqtwxfhvkjd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JBrDMqg_GQ7h_96fIZechA_L0LjkZbh";

// CONNECT SUPABASE

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById("message");

// SIGN UP

document.getElementById("signupForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("signupEmail").value;

const password =
document.getElementById("signupPassword").value;

message.textContent = "Creating account...";

const {data,error} =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){
message.textContent = error.message;
return;
}

message.textContent =
"Account created! Check your email if confirmation is required.";

});

// LOGIN

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

message.textContent = "Logging in...";

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if(error){
message.textContent = error.message;
return;
}

message.textContent = "Login successful!";

});

// CHECK SESSION

async function checkSession(){

const {data,error} =
await supabaseClient.auth.getSession();

if(data.session){
showDashboard(data.session.user);
}

}

// SHOW DASHBOARD

function showDashboard(user){

document.getElementById("auth").style.display="none";

document.getElementById("dashboard").style.display="block";

document.getElementById("userEmail").textContent =
"Email: " + user.email;

}

// LOGOUT

async function logout(){

const {error} = await supabaseClient.auth.signOut();

if(error){
message.textContent = error.message;
return;
}

document.getElementById("auth").style.display="block";

document.getElementById("dashboard").style.display="none";

message.textContent="Logged out successfully.";

}

// AUTH STATE LISTENER

supabaseClient.auth.onAuthStateChange((event,session)=>{

if(session){
showDashboard(session.user);
}

});

// INITIAL SESSION

checkSession();

</script>

</body>
</html>
